<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MATRIX — El código perdido</title><style>*{box-sizing:border-box}body{background:#101c20;color:#e4ffef;font:17px system-ui;margin:0}main{max-width:850px;margin:auto;padding:24px}h1{letter-spacing:5px;color:#74e5a6}small{color:#a7cbbb}section{border:1px solid #426c58;border-radius:15px;padding:22px;margin:18px 0;background:#192b29}input,textarea,button{font:inherit;border-radius:8px;padding:12px}input,textarea{width:100%;background:#101c20;color:white;border:1px solid #63947b;margin:8px 0}button{background:#83e9ad;color:#10251a;border:0;cursor:pointer;margin:5px}button:disabled{opacity:.4}pre{white-space:pre-wrap;font:18px monospace;line-height:1.5}#bar{height:10px;background:#32463d;border-radius:10px}#fill{height:100%;background:#83e9ad;border-radius:10px} .muted{color:#a7cbbb} @media print{body{background:white;color:black}section{background:white;border:1px solid #aaa}button{display:none}h1{color:black}}</style><main><small>LABORATORIO CENTRAL / PCE Y12</small><h1>MATRIX</h1><p>El código perdido · Calcula, demuestra, justifica.</p><label>Nombre o equipo<input id="team" placeholder="Nombre del equipo"></label><div id="bar"><div id="fill"></div></div><div id="game"></div><button onclick="report()">Descargar evidencias (.txt)</button><button onclick="if(confirm('¿Borrar la partida?')){localStorage.removeItem('matrixPCE');location.reload()}">Reiniciar</button><p class="muted">El sistema comprueba las claves numéricas, no la validez matemática de las justificaciones. El docente revisa las evidencias.</p></main><script>
const qs=[
['01 · El archivo alterado','A = [2  1; −1  3]     B = [1  −2; 4  0]\nCalcula C = A − B y det(C).','Introduce det(C).','18','Resta elemento a elemento. Calcula ad−bc.','','18','Explica por qué la resta es posible y muestra cada entrada de C y el determinante.'],
['02 · El orden importa','A = [1  2; 0  1]     B = [2  0; 3  1]\nCalcula AB y BA.','Introduce la entrada (1,1) de AB.','8','Multiplica fila por columna.','','8','Muestra ambos productos y justifica con una entrada por qué AB ≠ BA.'],
['03 · La puerta inversa','M = [3  1; 2  1]\nCalcula M⁻¹ y comprueba el resultado.','Introduce la entrada (1,2) de M⁻¹.','-1','Comprueba primero que el determinante no sea cero.','','-1','Justifica la existencia de la inversa y verifica el producto con M.'],
['04 · El parámetro oculto','P = [1  2  0; 0  k  1; 0  2  1]\nEncuentra k para que P no sea invertible.','Introduce k.','2','Desarrolla por la primera columna.','','2','Desarrolla el determinante y justifica el rango para el valor obtenido.'],
['05 · Las tres coordenadas','x + y + z = 6\n2x − y + z = 3\nx + 2y − z = 2','Introduce x,y,z separados por comas.','1,2,3','Usa Gauss o Cramer y comprueba las tres ecuaciones.','','1,2,3','Escribe la matriz ampliada, las operaciones realizadas y comprueba las soluciones.'],
['06 · El sistema definitivo','x + y = 3\n2x + ky = 6\nClasifica el sistema según k. Después cambia el segundo término independiente a 7 y vuelve a clasificarlo.','Introduce el valor crítico de k.','2','Compara los rangos de A y de la ampliada, o usa eliminación.','','2','Justifica todos los casos mediante rangos o ecuaciones equivalentes.']];
let s;try{s=JSON.parse(localStorage.getItem('matrixPCE'))||{i:0,entries:[]}}catch{s={i:0,entries:[]}};const $=id=>document.getElementById(id);$('team').value=s.team||'';function save(){s.team=$('team').value;localStorage.setItem('matrixPCE',JSON.stringify(s))} $('team').oninput=save;
function render(){ $('fill').style.width=(s.i/6*100)+'%'; if(s.i===6){$('game').innerHTML='<section><h2>🔓 Sistema recuperado</h2><p>Seis claves verificadas. Entrega tus evidencias al docente para validar las justificaciones.</p><button onclick="report()">Entregar evidencias</button></section>';return}let q=qs[s.i];$('game').innerHTML=`<section><small>NIVEL ${s.i+1} DE 6</small><h2>${q[0]}</h2><pre>${q[1]}</pre><p><b>${q[7]}</b></p><label>Justificación matemática<textarea id="why" rows="7" placeholder="Operaciones, propiedades y conclusión..."></textarea></label><label>${q[2]}<input id="ans" autocomplete="off"></label><button onclick="check()">Validar clave</button><button onclick="$('hint').textContent=qs[s.i][4]">Solicitar pista</button><p id="hint"></p><p id="msg" role="status"></p></section>`;if(s.draft){$('why').value=s.draft.why||'';$('ans').value=s.draft.ans||''}for(const id of ['why','ans'])$(id).oninput=()=>{s.draft={why:$('why').value,ans:$('ans').value};save()}}
function check(){let q=qs[s.i],why=$('why').value.trim(),ans=$('ans').value.replace(/\s/g,'').replace(/−/g,'-');if(!$('team').value.trim()){ $('msg').textContent='Introduce tu nombre o equipo.';return}if(!why){$('msg').textContent='Escribe tu justificación antes de validar.';return}if(ans!==q[6]){$('msg').textContent='Clave incorrecta. Revisa el procedimiento.';return}s.entries.push({level:q[0],answer:ans,why});s.i++;delete s.draft;save();render()}
function report(){save();let txt='MATRIX — Evidencias\nEquipo: '+(s.team||'Sin nombre')+'\nClaves: '+s.i+'/6\n\n'+s.entries.map(e=>e.level+'\nClave: '+e.answer+'\nJustificación: '+e.why).join('\n\n');if(s.draft)txt+='\n\nBorrador actual:\n'+s.draft.ans+'\n'+s.draft.why;let u=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'}));let a=document.createElement('a');a.href=u;a.download='Matrix_evidencias_'+(s.team||'sin_nombre').replace(/[^\p{L}\p{N}_-]/gu,'_')+'.txt';a.click();URL.revokeObjectURL(u)}render();</script></html>
